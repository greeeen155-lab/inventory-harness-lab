name: 유지보수 작업
description: 버그 수정·기능 개선·리팩터링·문서 설정 변경을 요청합니다. 모든 항목은 다른 사람이 실행해 참·거짓을 판정할 수 있어야 하며, 대상은 경로로 크기는 수치로 완료는 기대 결과로 작성합니다.
title: "[유지보수] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        유지보수 작업을 시작하기 전에 아래 항목을 구체적으로 작성해 주세요.
        제출된 Issue가 이 작업의 원본(SSOT)입니다.

        ## 모든 항목의 공통 기준

        이 Issue는 AI와 사람이 **같은 기준으로 완료를 판정**하기 위한 계약입니다. 다음 세 가지가 모든 항목에 적용됩니다.

        | 무엇을 | 어떻게 쓰는가 | 판정 불가한 표현 |
        |---|---|---|
        | 대상 | 파일 경로, 함수명, 화면 경로, 문서 절 번호 | 재고 쪽, 관련 부분, 중요한 파일 |
        | 크기 | 개수, 초, %, 상태값 | 많이, 빠르게, 충분히 |
        | 완료 | 실행 명령과 그 출력값 | 정상 작동, 문제 없음, 개선됨 |

        추상적인 표현이 하나라도 남아 있으면, 작업 도중 해석이 갈리고 완료 시점에 참·거짓을 가릴 수 없습니다.

        ## 되는 예 — 판정 가능한 Issue

        - **작업 제목**: 만료 로트를 가용 재고 합계에서 제외
        - **배경**: 재고 목록에서 '치킨 스틱 10p'의 가용이 90개로 표시된다. 로트는 만료 20개(2026-08-23) + 정상 70개(2026-11-30)이므로 기대값은 70개다. 상단 총계 944개도 같은 이유로 오염되어 있으며 기대값은 924개다. 8개 SKU 중 1개가 영향 대상이다.
        - **변경할 내용**: `src/lib/inventory/availability.ts`의 `calculateAvailable()`에서 유통기한이 오늘 이전인 로트를 합계에서 제외한다. 출고 우선순위 정렬은 이번 범위 밖이다.
        - **종료 조건**: `npm test` 종료 코드 0, 테스트 19개 전부 통과(AND). 목록 총계가 `가용 924개`, 치킨 스틱 행이 `70개`로 표시.
        - **검증**: `tests/issues/issue-12-availability.test.ts`에서 만료 20 + 정상 70 fixture의 반환값이 `70`인지 확인. `/inventory` 화면에서 총계와 행 값 확인.
        - **건드리면 안 되는 것**: `docs/harness/00-ssot.md`, `AGENTS.md`, `CLAUDE.md` 변경 금지. `GET /api/inventory` 응답 필드명·타입 유지. 만료 로트 데이터 자체는 삭제하지 않는다.
        - **구현 루프 최대 횟수**: 3

        판정이 가능한 이유 — 대상이 경로로 특정되고, 90→70과 944→924라는 **수치 대비**가 있으며, 종료 조건이 **실행 가능한 명령과 출력값**으로 닫혀 있습니다.

        ## 안 되는 예 — 판정 불가한 Issue

        - **작업 제목**: 재고 오류 수정
        - **배경**: 수량이 이상하게 나온다는 얘기가 있어 확인이 필요함
        - **변경할 내용**: 재고 계산 로직 점검하고 관련된 부분 정리
        - **종료 조건**: 정상적으로 작동하면 완료
        - **검증**: 테스트 돌려서 확인
        - **건드리면 안 되는 것**: 없음
        - **구현 루프 최대 횟수**: 될 때까지

        판정이 불가능한 이유 — 어느 화면의 어떤 값이 얼마여야 하는지 없고, '관련된 부분'은 범위가 닫히지 않으며, '정상 작동'과 '테스트 돌려서'는 실행해도 참·거짓이 나오지 않습니다. '없음'과 '될 때까지'는 중단 기준을 지웁니다.

  - type: input
    id: title
    attributes:
      label: 작업 제목
      description: |
        변경 대상과 기대 결과가 드러나도록 한 문장으로 요약해 주세요. 원인이나 해결 방법보다 **무엇을 어떻게 바꾸는지**에 집중합니다.

        되는 예
        - 재고 검색 결과가 새로고침 후 사라지는 문제 수정
        - 만료 로트를 가용 재고 합계에서 제외

        안 되는 예
        - 재고 오류 (대상과 기대 결과가 없음)
        - useEffect 의존성 배열 수정 (해결 방법만 있고 무엇이 좋아지는지 없음)
      placeholder: 예) 재고 검색 결과가 새로고침 후 사라지는 문제 수정
    validations:
      required: true

  - type: dropdown
    id: work-type
    attributes:
      label: 작업 유형
      description: |
        가장 가까운 작업 유형을 선택해 주세요. 판단 기준은 다음과 같습니다.

        - **버그 수정** — 기대 동작이 이미 정의돼 있는데 실제 동작이 다른 경우
        - **기능 개선** — 동작은 정상이지만 기대 동작 자체를 바꾸는 경우
        - **리팩터링** — 외부에서 관찰되는 동작은 그대로 두고 내부 구조만 바꾸는 경우
        - **문서·설정** — 실행 코드 변경 없이 문서·설정·CI만 바꾸는 경우
      options:
        - 버그 수정
        - 기능 개선
        - 리팩터링
        - 문서·설정
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 1. 배경
      description: |
        왜 이 작업이 필요한가요? **관측된 사실**과 **영향 범위**를 수치로 적어 주세요. 추측이 섞이면 어디까지가 확인된 사실인지 구분해 주세요.

        다음을 포함해 주세요.
        - 재현 조건: 어떤 화면에서 어떤 조작을 했을 때
        - 기대 동작 vs 실제 동작: 각각의 값 또는 화면 상태
        - 영향 범위: 몇 개 SKU / 몇 명의 사용자 / 어떤 기능이 함께 틀어지는가

        되는 예
        - 재고 목록에서 '치킨 스틱 10p'의 가용 수량이 90개로 표시된다. 로트 구성은 만료 20개(2026-08-23) + 정상 70개(2026-11-30)이므로 기대값은 70개다. 만료 로트가 가용 합계에 포함되고 있다. 상단 총계 944개도 같은 이유로 오염되어 있으며, 만료분 20개를 제외한 924개가 기대값이다. 8개 SKU 중 만료 로트를 가진 1개가 영향 대상이다.

        안 되는 예
        - 재고 수량이 이상하게 나옴 (어느 화면, 어떤 값, 기대값이 얼마인지 없음)
        - 사용자들이 불편해함 (관측 사실이 아님)
      placeholder: |
        - 재현 조건:
        - 기대 동작:
        - 실제 동작:
        - 영향 범위:
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: 2. 변경할 내용
      description: |
        무엇을 수정하거나 추가하나요? **변경 대상을 경로로**, **기대 동작을 값으로** 적어 주세요. 원인 분석이 끝나지 않았다면 "조사 후 결정"이라고 명시하고 조사 범위를 적습니다.

        다음을 포함해 주세요.
        - 대상: 파일 경로, 함수명, 화면명, 문서 경로
        - 기대 동작: 변경 후 어떤 입력에 어떤 출력이 나와야 하는가
        - 범위 밖: 이번 작업에서 다루지 않는 것

        되는 예
        - 대상: `src/lib/inventory/availability.ts`의 `calculateAvailable()`
        - 기대 동작: 유통기한이 오늘 이전인 로트를 합계에서 제외한다. 만료 20 + 정상 70인 SKU의 반환값이 90에서 70으로 바뀐다.
        - 범위 밖: 출고 우선순위 정렬 로직(별도 Issue로 분리)

        안 되는 예
        - 재고 계산 로직 수정 (어느 파일의 무엇을, 어떤 값으로 바꾸는지 없음)
        - 관련된 부분 전체 정리 (범위가 닫혀 있지 않음)
      placeholder: |
        - 대상:
        - 기대 동작:
        - 범위 밖:
    validations:
      required: true

  - type: textarea
    id: done-criteria
    attributes:
      label: 3. 종료 조건
      description: |
        **실행해서 참·거짓을 확인할 수 있는 형태**로 작성해 주세요. 조건마다 아래 세 줄을 모두 채웁니다. 하나라도 비면 그 조건은 판정 불가로 간주합니다.

        - **기준** — 무엇을 확인하는가 (명령, 화면 경로, 응답 필드, 함수 반환값)
        - **수치** — 몇 개 / 몇 초 / 몇 % / 어떤 상태값인가
        - **기대 결과** — 실행 후 화면이나 콘솔에 나와야 할 값·메시지·종료 코드

        마지막 줄에 **판정 방식(AND / OR)** 을 반드시 적어 주세요. 조건이 하나뿐이어도 `AND`로 표기합니다.

        되는 예
        - 조건 1
          - 기준: `npm test` 실행
          - 수치: 테스트 19개, 종료 코드 0
          - 기대 결과: `Tests: 19 passed, 19 total`, 종료 코드 `0`
        - 조건 2
          - 기준: `/inventory` 화면 상단 총계
          - 수치: 944개 → 924개
          - 기대 결과: `가용 924개`로 표시
        - 조건 3
          - 기준: `/inventory` 목록의 '치킨 스틱 10p' 행 가용 열
          - 수치: 90개 → 70개
          - 기대 결과: `70개`로 표시
        - 판정: 조건 1·2·3 모두 충족(AND)

        안 되는 예
        - 기능이 정상적으로 작동하면 완료 → 무엇을 실행해 무엇을 보는지 없어 재현 불가
        - 문제가 없으면 완료 → '문제'의 정의가 사람마다 달라 참·거짓이 갈림
        - 테스트가 대부분 통과하면 완료 → '대부분'은 수치가 아니라 임계값을 세울 수 없음
        - 성능이 개선되면 완료 → 무엇을 몇 ms에서 몇 ms로 줄이는지 없음
        - 화면이 자연스러워지면 완료 → 기대 결과가 값이 아니라 인상평임
      placeholder: |
        조건 1
        - 기준:
        - 수치:
        - 기대 결과:

        조건 2
        - 기준:
        - 수치:
        - 기대 결과:

        판정: 모든 조건 충족(AND) / 하나만 충족(OR)
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **종료 조건 자가 점검**

        아래 네 가지에 모두 "예"라고 답할 수 있어야 제출 가능합니다.

        1. 이 Issue를 처음 보는 사람이 조건만 읽고 같은 명령을 실행할 수 있는가?
        2. 실행 결과를 보고 나와 그 사람이 **같은 참·거짓 결론**에 도달하는가?
        3. 모든 수치가 개수·시간·퍼센트·상태값 중 하나로 적혀 있는가?
        4. 조건이 둘 이상이면 AND인지 OR인지 밝혀져 있는가?

  - type: textarea
    id: verification
    attributes:
      label: 4. 검증
      description: |
        위 종료 조건을 **어떤 명령과 절차로** 판정하나요? 여기 적힌 것만으로 제3자가 그대로 재현할 수 있어야 합니다.

        ### 4-1. 기계 검증 테스트 (필수)

        각 Issue의 종료 조건을 코드로 판정하는 테스트를 다음 규칙으로 작성합니다.

        - **파일 경로**: `tests/issues/issue-{Issue 번호}-{기능명}.test.ts`
          - `{Issue 번호}`는 하이픈 없는 숫자, `{기능명}`은 소문자 케밥 케이스 (예: `issue-12-availability`)
          - 작성 시점에 Issue 번호를 모르면 자리표시자를 그대로 두고, **Issue 발행 직후 실제 번호로 치환**한다고 명시해 주세요.
        - **테스트 내용**: 종료 조건의 기준·수치·기대 결과를 그대로 `expect`로 옮깁니다. 조건 1개당 최소 테스트 케이스 1개를 대응시킵니다.
        - **실행 명령**: 복사해서 그대로 붙여넣을 수 있는 형태로 적습니다.
        - **통과 기준**: 종료 코드, 통과한 테스트 개수, 기대값을 함께 적습니다.
        - **분리 원칙**: 기계로 판정 가능한 조건은 전부 이 테스트에 넣고, **판정 불가능한 것만** 4-2 수동 확인으로 내립니다.

        ### 4-2. 수동 확인

        기계 검증이 불가능한 항목만 `화면 경로 → 조작 → 화면에 보여야 할 값` 순서로 적습니다.

        ### 4-3. 회귀 확인

        이번 변경으로 깨질 수 있는 기존 동작과, 그것이 그대로여야 함을 확인하는 방법을 적습니다.

        되는 예
        - 기계 검증 테스트 파일: `tests/issues/issue-12-availability.test.ts` (Issue 발행 후 실제 번호 `12`로 확정)
        - 테스트 케이스
          - `만료 로트를 가용 합계에서 제외한다`: 만료 20개(2026-08-23) + 정상 70개(2026-11-30) fixture → `calculateAvailable()` 반환값이 `70`
          - `만료 로트가 없으면 기존 합계를 유지한다`: 정상 70개 단일 fixture → 반환값이 `70`
        - 실행 명령: `npm test -- tests/issues/issue-12-availability.test.ts`
        - 통과 기준: 테스트 2개 통과, 실패 0개, 종료 코드 `0`
        - 전체 실행: `npm test` → 테스트 19개 통과, 종료 코드 `0`
        - 수동 확인: `/inventory` 접속 → 상단 총계가 `가용 924개`, '치킨 스틱 10p' 행이 `70개`
        - 회귀 확인: `/inventory` 필터 '만료' 선택 시 치킨 스틱 1건이 여전히 조회된다(만료 로트 데이터 자체는 남아 있어야 함)

        안 되는 예
        - 테스트 돌려서 확인 → 파일 경로·입력·기대값·통과 기준이 없음
        - `tests/issues/issue-12-availability.test.ts`를 만든다 → 어떤 종료 조건을 어떤 값으로 판정하는지 없음
        - 테스트 파일명은 알아서 정함 → 경로 규칙을 벗어나 Issue와 테스트의 대응이 끊김
        - 화면에서 눈으로 확인 → 어느 화면의 어떤 값인지 없음
      placeholder: |
        [기계 검증]
        - 테스트 파일: `tests/issues/issue-{Issue 번호}-{기능명}.test.ts`
        - 테스트 케이스 및 기대값:
        - 실행 명령:
        - 통과 기준(종료 코드 / 통과 개수):

        [수동 확인]
        - 화면 경로 → 조작 → 기대 표시값:

        [회귀 확인]
        - 유지되어야 할 기존 동작 및 확인 방법:
    validations:
      required: true

  - type: textarea
    id: protected-scope
    attributes:
      label: 5. 건드리면 안 되는 것
      description: |
        변경하면 안 되는 파일·기능·데이터·인터페이스 또는 호환성 조건을 **경로와 조건**으로 적어 주세요. "없음"이라고 적으려면, 정말 어떤 기존 동작도 유지할 필요가 없는지 확인한 뒤에 적어 주세요.

        다음을 확인해 주세요.
        - 보호 경로: `docs/harness/00-ssot.md`에 등록된 경로는 사람 승인 없이 변경할 수 없습니다. 이번 작업이 그중 하나를 건드린다면 여기 명시하고, 왜 필요한지 함께 적어 주세요.
        - 유지할 계약: 변경하면 안 되는 API 응답 형태, DB 스키마, 함수 시그니처
        - 유지할 동작: 이번 변경과 무관하게 그대로여야 하는 화면·값

        되는 예
        - `docs/harness/00-ssot.md`, `AGENTS.md`, `CLAUDE.md`는 변경하지 않는다.
        - `GET /api/inventory` 응답의 필드 이름과 타입은 그대로 유지한다. 값만 바뀐다.
        - Prisma 스키마는 변경하지 않는다. 마이그레이션 파일이 새로 생기면 안 된다.
        - 만료 로트 데이터 자체는 삭제하지 않는다. 합계에서 제외할 뿐이다.

        안 되는 예
        - 없음 (확인 없이 적은 경우)
        - 중요한 파일은 건드리지 말 것 (어떤 파일인지 없음)
      placeholder: |
        - 보호 경로:
        - 유지할 계약:
        - 유지할 동작:
    validations:
      required: true

  - type: input
    id: max-loops
    attributes:
      label: 6. 구현 루프 최대 횟수
      description: |
        구현과 검증을 반복할 수 있는 상한을 **양의 정수**로 적어 주세요. 기본값은 `3`입니다.

        **1회의 정의** — 변경을 구현한 뒤, 이 Issue의 4. 검증에 적힌 명령을 처음부터 끝까지 한 번 실행하는 것입니다. 부분 실행이나 재실행은 별도 회차로 세지 않고, 검증 전체를 완주한 시점에 1회가 소진됩니다.

        **반복 규칙**
        - 검증이 통과하지 않으면 AI는 실패 원인을 수정하고 다음 1회를 시도합니다.
        - 통과하면 남은 횟수와 무관하게 즉시 종료합니다.

        **상한 도달 시 중단** — 정해진 횟수 안에 통과하지 못하면 AI는 **더 이상 반복하지 않고 멈춥니다.** 그리고 다음을 Issue에 댓글로 남긴 뒤 `NEEDS_HUMAN` 상태로 사람에게 넘깁니다.

        1. 현재 코드 상태 (변경된 파일 목록)
        2. 회차별 시도한 변경 내용
        3. 마지막 검증 실행 명령과 그 출력 전문 (실패 메시지 포함)
        4. 막힌 지점에 대한 판단과, 사람에게 필요한 결정 사항

        **금지 사항** — 사람의 승인 없이 상한을 늘리거나, 상한을 넘겨 계속 실행하거나, 검증을 통과시키기 위해 종료 조건·테스트 기대값을 수정하지 않습니다.

        되는 예
        - `3` — 최대 3회 시도하며, 3회 안에 통과하지 못하면 중단하고 `NEEDS_HUMAN`으로 인계
        - `5` — 원인이 여러 갈래로 예상되는 조사성 작업에 부여
        - `1` — 변경 범위가 한 줄로 확정된 작업에 부여
        - 비워둘 경우 기본값 `3`으로 처리

        안 되는 예
        - 될 때까지 — 상한이 없어 중단 시점을 판정할 수 없음
        - 가능한 한 많이 — 숫자가 아니며 반복 상한이 없음
        - 3~5회 — 범위값이라 몇 회차에서 멈추는지 확정되지 않음
        - 실패할 때마다 +1 — 사람의 승인 없는 상한 변경
      value: "3"
      placeholder: "예) 3 (기본값: 3)"
    validations:
      required: true

  - type: textarea
    id: source-references
    attributes:
      label: 원본 문서 및 Issue 참조
      description: |
        관련 SSOT와 원본 문서를 **링크**로 걸어 주세요. 작업의 범위와 수용조건은 이 Issue를 원본으로 삼습니다. 해당 없는 항목은 비우지 말고 '해당 없음'이라고 적어 주세요.

        되는 예
        - SSOT: https://github.com/greeeen155-lab/inventory-harness-lab/blob/main/docs/harness/00-ssot.md
        - 요구사항: docs/01-requirements.md §4.2 유통기한 관리
        - 아키텍처: 해당 없음
        - 관련 Issue: #12 (선행), #15 (중복 아님, 범위 분리됨)

        안 되는 예
        - SSOT 참고 (링크 없음)
        - 문서 참조함 (어느 문서의 어느 절인지 없음)
      placeholder: |
        - SSOT: https://github.com/greeeen155-lab/inventory-harness-lab/blob/main/docs/harness/00-ssot.md
        - 요구사항: 해당 없음 또는 링크
        - 아키텍처: 해당 없음 또는 링크
        - 관련 Issue: 해당 없음 또는 #번호
    validations:
      required: true